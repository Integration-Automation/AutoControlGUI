name: Platform smoke

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  stable-api:
    strategy:
      fail-fast: false
      matrix:
        # arm64 is not a rounding error on the desktop any more, and the
        # dependency set is where it shows: opencv, pillow and cryptography
        # all ship native wheels, and a missing arm64 wheel means a source
        # build that either takes an hour or fails. macos-14 is already
        # arm64; these add the other two.
        os: [windows-2022, ubuntu-22.04, macos-14, ubuntu-22.04-arm,
             windows-11-arm]
        python-version: ["3.10", "3.14"]
        exclude:
          # windows-11-arm has no 3.10 build available through setup-python.
          - os: windows-11-arm
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .  # NOSONAR githubactions:S8544  # reason: installs the checked-out project itself, there is no upstream version to lock
      # The X11 backend connects to a display at import time, so Linux
      # runs need a virtual one.
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Import stable API and generate platform-neutral code
        shell: bash
        run: >-
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
          python -c "import je_auto_control.api as ac;
          compile(ac.generate_code([['AC_screen_size']], style='actions'),
          '<generated>', 'exec')"
      - name: Create headless diagnostic bundle
        shell: bash
        run: >-
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
          python -c "from je_auto_control.api import
          FailureBundleOptions, create_failure_bundle;
          create_failure_bundle('platform-smoke.zip',
          options=FailureBundleOptions(screenshot=False))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-smoke-${{ matrix.os }}-${{ matrix.python-version }}
          path: platform-smoke.zip
          if-no-files-found: warn

  freebsd:
    name: The X11 backend's platform guards on a real FreeBSD
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # The X11 backend was gated on sys.platform being linux/linux2, so it
      # refused to import on a FreeBSD desktop that runs the same X server,
      # the same python-Xlib and the same code. Relaxing that guard is only
      # worth anything if something actually runs it on a BSD, and no hosted
      # runner is one — so this boots a real FreeBSD VM inside the runner.
      #
      # What it checks is the platform layer, not the whole package: the
      # heavy dependencies (opencv in particular) have no FreeBSD wheels, so
      # a full install would build from source for an hour or fail. The
      # guards and the wrapper's routing are the change; they are what runs.
      # nosemgrep: yaml.github-actions.security.third-party-action-not-pinned-to-commit-sha.third-party-action-not-pinned-to-commit-sha
      - uses: vmactions/freebsd-vm@v1  # NOSONAR githubactions:S7637
        with:
          release: "14.2"
          usesh: true
          # Only the interpreter and an X server come from pkg. The flavoured
          # port names (py311-pip, py311-xlib) depend on which Python
          # flavour the release defaults to and were not in 14.2's
          # repository at all; python-Xlib is pure Python, so pip is both
          # simpler and version-exact.
          prepare: |
            pkg install -y python311 xorg-vfbserver xauth
          run: |
            set -eu
            echo "uname: $(uname -a)"
            python3.11 - <<'PROBE'
            import sys
            sys.path.insert(0, ".")
            from je_auto_control.utils.platform_id import (
                current_family, is_bsd, is_x11_unix,
            )
            print("sys.platform:", sys.platform)
            assert sys.platform.startswith("freebsd"), sys.platform
            assert is_bsd(), "FreeBSD is not recognised as a BSD"
            assert is_x11_unix(), "FreeBSD is not recognised as an X11 unix"
            assert current_family() == "bsd", current_family()
            print("platform_id: OK")
            PROBE
            # python-Xlib is the X11 backend's one dependency and is pure
            # Python, so pip installs it here without a compiler. Failing
            # loudly matters: without it the import below would fail for a
            # reason that has nothing to do with the platform guards.
            python3.11 -m ensurepip --upgrade
            python3.11 -m pip install --quiet "python-Xlib==0.33"

            # The guards are what refused to load here. Import the X11
            # modules directly, under a real X server, without dragging in
            # the package's heavy dependencies.
            Xvfb :99 -screen 0 1280x800x24 &
            sleep 3
            DISPLAY=:99 python3.11 - <<'BACKEND'
            import sys
            sys.path.insert(0, ".")
            from je_auto_control.linux_with_x11.core.utils import (
                x11_linux_display, x11_linux_vk,
            )
            from je_auto_control.linux_with_x11.mouse import (
                x11_linux_mouse_control as mouse,
            )
            from je_auto_control.linux_with_x11.screen import (
                x11_linux_screen as screen,
            )
            print("display:", x11_linux_display.display)
            print("screen size:", screen.size())
            mouse.set_position(321, 123)
            landed = mouse.position()
            assert landed == (321, 123), landed
            print("pointer round-trip on FreeBSD:", landed)
            print("keycode for 'a':", x11_linux_vk.x11_linux_key_a)
            BACKEND

  macos-capabilities:
    name: What a real macOS runner permits
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e .  # NOSONAR githubactions:S8544  # reason: installs the checked-out project itself, there is no upstream version to lock

      # macOS is the one supported platform with no container to put it in,
      # and every macOS row in docs/CAPABILITY_MATRIX.md said
      # "implementation": the code was there and nothing had run it on a Mac.
      #
      # Two of these capabilities are gated by TCC — macOS asks a *user* to
      # grant Screen Recording and Accessibility, and a CI runner has no user
      # to ask. Which of them a runner grants is not something to guess at,
      # and guessing is how the Wayland work twice recorded a desktop's
      # refusal as a container's limitation.
      #
      # Measured first, in --measure mode, and the answer was a surprise: a
      # macos-14 runner grants BOTH Screen Recording and Accessibility, so
      # every capability works — capture returns real pixels rather than the
      # black rectangle a refusal produces, CGEventPost moves the cursor and
      # the move reads back exactly, and the AX walk returns real elements.
      # The usual assumption that CI cannot exercise a TCC-gated macOS API is
      # simply wrong for this runner.
      #
      # So the flag is off and this is a gate now: EXPECTED in the script
      # holds what was measured, and a capability appearing or disappearing
      # turns this red and names which one.
      - name: Verify the macOS backend against a real window server
        run: python test/verify/macos_verify.py
