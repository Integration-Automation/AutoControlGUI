name: AutoControl Code Quality

# Static analysis (ruff, bandit) plus the headless pytest suite added in
# rounds 22-30. Decoupled from the existing dev/stable workflows, which
# run legacy standalone test scripts and exist for hardware integration
# coverage on Windows runners.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: "pip install --only-binary :all: ruff==0.16.0"

      - name: Run ruff
        run: ruff check je_auto_control/ je_auto_control_pytest.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install bandit
        run: "pip install --only-binary :all: bandit==1.9.4"

      - name: Run bandit (recursive, skip tests + i18n dicts)
        run: bandit -r je_auto_control/ je_auto_control_pytest.py -c pyproject.toml

  pytest-headless:
    # The suite ran on Windows alone for its whole life, so every
    # platform assumption it holds went unmeasured on the two operating
    # systems the project also claims to support. Linux and macOS are
    # here to measure them; they carry the two ends of the supported
    # Python range rather than all five, because what differs between
    # 3.10 and 3.14 is Python and what differs here is the OS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, python-version: "3.10" }
          - { os: windows-2022, python-version: "3.11" }
          - { os: windows-2022, python-version: "3.12" }
          - { os: windows-2022, python-version: "3.13" }
          - { os: windows-2022, python-version: "3.14" }
          - { os: ubuntu-22.04, python-version: "3.10" }
          - { os: ubuntu-22.04, python-version: "3.14" }
          - { os: macos-14, python-version: "3.10" }
          - { os: macos-14, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Same set the container image installs, and for the same reasons:
      # the X11 backend connects to a display at import time, opencv and
      # PySide6 hard-require libGL/glib, and Qt's platform plugin needs
      # the xcb libraries. Without these the suite fails at collection
      # with a linker error rather than a test result.
      - name: Install X11 and Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils \
            libgl1 libegl1 libglib2.0-0 \
            libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      # One command per step, each on a single line: a `run: |` block scalar
      # swallows NOSONAR markers, so a justification inside one is a comment
      # that reads as handled and suppresses nothing.
      - name: Upgrade the installer
        shell: bash
        run: python -m pip install --upgrade pip wheel  # NOSONAR githubactions:S8544  # reason: pip and wheel are the installer; pinning them here would pin the tool that applies the pins below

      # Install the editable package FIRST so its source dir is the one
      # Python sees on subsequent imports. We deliberately avoid
      # `pip install -r dev_requirements.txt` here because that file pulls in
      # `je_auto_control_dev` (a separate PyPI package), which ships its own
      # snapshot of `je_auto_control/` straight into site-packages and masks
      # the editable install for any sub-package the snapshot doesn't include
      # (admin, usb, remote_desktop, vision, …).
      #
      # `[webrtc]` is part of the install and is load-bearing for what this job
      # measures. Eleven modules under `utils/remote_desktop` raise ImportError
      # at module level without `aiortc`/`av` — 2,090 statements that were a
      # hard 0% here no matter what anyone wrote. Worse than the number: the
      # tests that cover the WebRTC host's auth, TLS, tokens and file transfer
      # were already written and `importorskip`ped straight past on every
      # square, so they ran on developer machines and nowhere else. Measured on
      # this tree, one variable changed: 513 of those statements are covered by
      # tests that exist today. The extra is NOT added to `typing-stable-api`
      # below — that gate must not depend on what is installed.
      #
      # `[signaling]` is there for the same reason. Every test of the signaling
      # server (`/sessions`, `/config`, `/blobs`, the body guard, the BadHost
      # fix) starts with `importorskip("fastapi")`, so without the extra the
      # whole server side of config sync ran on developer machines only. The
      # extra's own bounds are floors; the exact versions this job tests are
      # pinned on the tooling line below, with `httpx`, which the extra does not
      # need but `fastapi.testclient` does.
      - name: Install the project itself, with the WebRTC and signaling extras
        shell: bash
        run: pip install -e ".[webrtc,signaling]"  # NOSONAR githubactions:S8544 githubactions:S8541  # reason: installs the checked-out project itself, so there is no upstream version to lock and no third-party setup script to run

      - name: Install the test tooling
        shell: bash
        # Quoted: `--only-binary :all:` puts a colon-space inside the
        # scalar, which YAML reads as a mapping and refuses.
        run: "pip install --only-binary :all: ruff==0.16.0 bandit==1.9.4 pytest==9.1.1 pytest-timeout==2.4.0 pytest-rerunfailures==16.7 coverage==7.15.4 PySide6==6.11.2 radon==6.0.1 fastapi==0.143.0 starlette==1.7.0 uvicorn==0.54.0 httpx==0.28.1"

      # Paths come from `testpaths` in pyproject.toml. Do NOT pass an explicit
      # path here: an argument overrides testpaths, which previously meant the
      # flow_control tests were configured to run but silently never did.
      #
      # Linux runs under a real Xvfb rather than Qt's offscreen platform:
      # the X11 backend opens a display at import time, and offscreen
      # would hide exactly the breakage this job exists to find.
      #
      # `coverage run -m pytest`, NOT `pytest --cov`, and that is load-bearing:
      # this package registers a `pytest11` entry point, and while it pointed
      # at `je_auto_control.utils.pytest_plugin.plugin` pytest imported that
      # submodule while loading plugins — which executes
      # `je_auto_control/__init__.py`, the facade, and with it several hundred
      # modules. (The entry point is the top-level `je_auto_control_pytest`
      # now; `coverage run` stays because it does not depend on what a plugin
      # imports.) pytest-cov only starts measuring after that,
      # so every one of those modules' import-time lines was recorded as never
      # executed. Measured on this tree: 11,962 statements, 24 points, and the
      # worst-hit files were the biggest ones (`action_executor` +786,
      # `_handlers` +684). A package that registers a pytest plugin cannot
      # measure itself with `pytest --cov`; `coverage run` starts first.
      #
      # PYTHONFAULTHANDLER: pytest's own faulthandler covers only the window
      # between its configure and unconfigure, and a native crash here (Qt,
      # aiortc, a platform backend) is as likely while plugins load or the
      # interpreter shuts down. With the variable the dump is installed before
      # `coverage` starts, pytest leaves it in place, and the step log — the
      # only evidence a SIGSEGV leaves — names the Python line every thread
      # was on.
      - name: Run headless pytest suite under coverage
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: >-
          ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1280x800x24"' || '' }}
          python -m coverage run -m pytest -v --tb=short --timeout=120

      # XML before the floor check, so a square that fails the floor still
      # uploads the report that says which lines it was short of.
      - name: Write the coverage XML
        shell: bash
        run: python -m coverage xml

      - name: Enforce the coverage floor
        shell: bash
        run: python -m coverage report  # the floor is `fail_under` in pyproject.toml, so the ratchet lives in exactly one place

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

  # The job id is still `typing-stable-api` because it is a required check and
  # renaming it silently drops the requirement, but the scope is no longer the
  # stable API alone: mypy now checks the whole package, minus the shrink-only
  # list in `test/verify/typing_contract_exempt.txt`. The verify script also
  # runs the three target platforms mypy can be pointed at, so the Windows and
  # macOS backends are checked from this Ubuntu runner rather than skipped.
  typing-stable-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .  # NOSONAR githubactions:S8541,githubactions:S8544  # reason: installs the checked-out project itself, there is no upstream version to lock and the build must run
      - run: "pip install --only-binary :all: mypy==2.4.0"
      # Deliberately NOT installing the optional extras: the contract forces
      # every non-base third-party module to `Any` so the result cannot depend
      # on what is installed, and installing them here would only hide a
      # regression in that arrangement.
      - run: python test/verify/typing_contract_verify.py

  # The job above answers "is our own code consistent with itself" and reads
  # PySide6, aiortc and av as `Any` so that the answer does not depend on what
  # is installed. This one installs them and asks the two questions that job
  # cannot:
  #
  #   1. The ordinary contract again, with the extras present. It must print
  #      the same verdict as the bare install above; if it does not, the
  #      "forced to Any" override in pyproject.toml has a hole and the required
  #      check has started to depend on the environment.
  #   2. `--extras`: the same run with PySide6 / aiortc / av dropped from that
  #      override, so every call into Qt and aiortc is checked against the
  #      library's own signatures. What already failed when this was first
  #      measured is `test/verify/typing_extras_exempt.txt`, shrink-only; a
  #      module outside that list (every new GUI module) has to pass.
  #
  # Step 2 is a function of the stubs, so the libraries are pinned to the
  # versions the list was measured with. PySide6 generates its stubs per
  # platform and the Windows and Linux ones differ in 42 files; the list was
  # measured against both and is the same.
  #
  # A new id, not a rename: `typing-stable-api` is a required check.
  typing-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[gui,webrtc]"  # NOSONAR githubactions:S8541,githubactions:S8544  # reason: installs the checked-out project itself, there is no upstream version to lock and the build must run
      - run: "pip install --only-binary :all: mypy==2.4.0 PySide6==6.11.2 aiortc==1.15.0 av==17.1.0 aioice==0.10.2 pyee==14.0.0 pylibsrtp==1.0.0"
      - name: The ordinary contract does not change when the extras are installed
        run: python test/verify/typing_contract_verify.py
      - name: The package against the real PySide6 / aiortc / av types
        run: python test/verify/typing_contract_verify.py --extras

  # A run's variable scope is bound through a ContextVar, and "a thread started
  # in a run does not join it" used to be true only because a new thread starts
  # with an empty context on a default build. On a free-threaded build it
  # starts with a copy of its creator's. The headless suite holds the contract
  # with an emulation on every square and with `-X thread_inherit_context=1`
  # on 3.14 (test_execution_scope_threads.py); this runs the same three files
  # on a real free-threaded interpreter with the GIL off.
  #
  # The same rule covers the other per-thread state kept in context variables
  # -- the caller a request is served as, the device bound by use_device, the
  # heal-event stamp and a run's stop token (utils/thread_bound.py) -- whose
  # tests are the fourth file, test_thread_bound_context.py.
  #
  # The project is not pip-installed: opencv-python ships abi3 wheels only,
  # which a free-threaded interpreter cannot load, and nothing these tests
  # import needs it. The packages below are what importing the executor needs,
  # at the versions this was run with on Windows (CPython 3.14.8t).
  #
  # On Windows the free-threaded binary may be `python3.14t` beside a regular
  # `python`, so it is looked up by that name first and the next step refuses
  # to go on with an interpreter whose GIL is enabled.
  free-threaded-scope:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
      - name: Find the free-threaded interpreter
        shell: bash
        run: echo "FT_PYTHON=$(command -v python3.14t || command -v python)" >> "$GITHUB_ENV"
      - name: Refuse an interpreter with the GIL enabled
        shell: bash
        env:
          PYTHON_GIL: "0"
        run: '"$FT_PYTHON" -c "import sys; print(sys.version); raise SystemExit(sys._is_gil_enabled())"'
      - name: Install what importing the executor needs
        shell: bash
        run: '"$FT_PYTHON" -m pip install --only-binary :all: pytest==9.1.1 defusedxml==0.7.1 mss==10.2.0 pillow==12.3.0 cryptography==50.0.2 numpy==2.5.3'
      - name: Variable scope tests with inherited thread contexts and no GIL
        shell: bash
        env:
          PYTHON_GIL: "0"
          PYTHONPATH: ${{ github.workspace }}
        run: '"$FT_PYTHON" -X thread_inherit_context=1 -m pytest -q -p no:cacheprovider test/unit_test/headless/test_execution_scope_threads.py test/unit_test/headless/test_execution_scope_isolation.py test/unit_test/headless/test_scope_run_level_callers.py test/unit_test/headless/test_thread_bound_context.py'

  # Sphinx with warnings as errors. The headless suite reads every page with
  # the `dummy` builder when Sphinx is installed (test_sphinx_docs_build.py),
  # but the suite's own job does not install Sphinx, and the HTML writer is
  # where an unresolved reference or a missing static path shows. Nothing in
  # the tree uses autodoc, so the project itself is not installed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: "pip install --only-binary :all: sphinx==9.1.0 sphinx-rtd-theme==3.1.0"
      - name: Build the documentation, warnings as errors
        run: python -m sphinx -b html -W --keep-going -j auto -d "${{ runner.temp }}/doctrees" docs/source "${{ runner.temp }}/docs-html"
