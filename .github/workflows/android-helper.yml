name: Android device-side helper

# Builds and tests native/android_helper. Stage 1 is the fence ledger, a pure Kotlin
# state machine tested on the JVM; later stages add the instrumentation app and an
# emulator run. Nothing here holds a secret or publishes anything.

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "native/android_helper/**"
      - ".github/workflows/android-helper.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "native/android_helper/**"
      - ".github/workflows/android-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fence-ledger:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        # nosemgrep: yaml.github-actions.security.third-party-action-not-pinned-to-commit-sha.third-party-action-not-pinned-to-commit-sha
        uses: gradle/actions/setup-gradle@v4  # NOSONAR githubactions:S7637
        with:
          gradle-version: "8.11.1"

      - name: Test the fence ledger on the JVM
        run: gradle --no-daemon -p native/android_helper :core:test

  instrumentation-app:
    # The runner image ships the Android SDK (ANDROID_HOME); the debug APK is kept for the
    # emulator stage. Building it proves the app compiles against the ledger and protocol.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        # nosemgrep: yaml.github-actions.security.third-party-action-not-pinned-to-commit-sha.third-party-action-not-pinned-to-commit-sha
        uses: gradle/actions/setup-gradle@v4  # NOSONAR githubactions:S7637
        with:
          gradle-version: "8.11.1"

      - name: Build the instrumentation APK
        run: gradle --no-daemon -p native/android_helper :app:assembleDebug

      - name: Keep the APK for the emulator stage
        uses: actions/upload-artifact@v6
        with:
          name: android-helper-debug-apk
          path: native/android_helper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Temporary: writes the dependency lock files once so they can be committed;
      # removed again in the change that adds them.
      - name: Write the Gradle dependency lock files
        run: gradle --no-daemon -p native/android_helper dependencies :core:dependencies :app:dependencies --write-locks

      - name: Keep the lock files
        uses: actions/upload-artifact@v6
        with:
          name: android-helper-gradle-locks
          path: native/android_helper/**/gradle.lockfile
          if-no-files-found: error
          retention-days: 7
