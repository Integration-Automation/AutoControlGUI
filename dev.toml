# Development distribution metadata; installation and build declarations match pyproject.toml.
# Preserve the development distribution name and its independent version.
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "je_auto_control_dev"
version = "0.0.135"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
description = "GUI Automation Framework"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = [
    # Three requirements below carry the same marker, and it excludes exactly
    # one square: Windows on arm64. Neither package publishes a win_arm64
    # wheel, so pip fell back to building from source and CMake could not
    # configure for ARM64 -- twelve minutes, then failure, which is why the
    # runner had to leave the matrix. Nothing in the package needs them at
    # import time, so the marker is all that stood between this project and
    # that machine. PEP 508 markers have no boolean "not", hence "A or B".
    #
    #   opencv-python  no win_arm64 wheel in any version.
    #   cryptography   wheels stop at 46.0.3; our floor >=50.0.0 is a security
    #                  floor (GHSA-g6cj-pr64-35w5) and cannot be lowered.
    #   je_open_cv     pure Python, but it depends on opencv-python, so leaving
    #                  it unmarked drags OpenCV back in through the side door.
    #
    # Pillow is deliberately NOT marked: it has always shipped win_arm64
    # wheels and was never a blocker. Re-check upstream in ten seconds, no
    # runner required:
    #
    #   pip install --dry-run --only-binary=:all: --platform win_arm64 \
    #       --python-version 3.12 --target /tmp/probe \
    #       'opencv-python>=4.8,<6' 'cryptography>=50.0.0'
    #
    # When both resolve, drop the marker from all three lines. Progress.md
    # records what Windows arm64 gives up in the meantime.
    "je_open_cv==0.0.22; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # je_open_cv leaves opencv-python unpinned; bound the major so a new
    # OpenCV release cannot silently change cv2 return shapes under us.
    "opencv-python>=4.8,<6; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pillow==12.3.0",
    # NumPy/Pillow implements bounded image matching and BGR conversion without
    # OpenCV on win_arm64. 2.4.6 has wheels for Python 3.11 through 3.14 there.
    "numpy==2.4.6; sys_platform == 'win32' and platform_machine == 'ARM64' and python_version >= '3.11'",
    "pyobjc-core==12.2.1;platform_system=='Darwin'",
    "pyobjc==12.2.1;platform_system=='Darwin'",
    # The BSDs run the same X11 stack, and platform_system is the kernel
    # name there ("FreeBSD", "OpenBSD", "NetBSD"), so a Linux-only marker
    # left the X11 backend without its one dependency on every one of them.
    "python-Xlib==0.33;platform_system=='Linux' or platform_system=='FreeBSD' or platform_system=='OpenBSD' or platform_system=='NetBSD'",
    "mss==10.2.0",
    "defusedxml==0.7.1",
    "cryptography>=50.0.0; sys_platform != 'win32' or platform_machine != 'ARM64'"
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent"
]

[project.scripts]
je_auto_control = "je_auto_control.cli:main"
je_auto_control_mcp = "je_auto_control.utils.mcp_server.__main__:main"

[project.entry-points.pytest11]
je_auto_control = "je_auto_control_pytest"

[project.urls]
Homepage = "https://github.com/Integration-Automation/AutoControlGUI"
Documentation = "https://autocontrol.readthedocs.io/en/latest/"
Code = "https://github.com/Integration-Automation/AutoControlGUI"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
py-modules = ["je_auto_control_pytest"]

[tool.setuptools.packages]
find = { namespaces = false }

[tool.setuptools.package-data]
"je_auto_control" = ["py.typed"]
"je_auto_control.utils.remote_desktop" = [
    "web_viewer/*.html",
    "web_viewer/*.js",
    "web_viewer/*.svg",
    "web_viewer/*.webmanifest",
    "web_viewer/mic-worklet.js",
]

[project.optional-dependencies]
gui = ["PySide6==6.11.1", "qt-material==2.17"]
webrtc = ["aiortc>=1.14.0", "av>=14.0.0"]
signaling = ["fastapi>=0.115", "starlette>=1.0.1", "uvicorn>=0.32"]
discovery = ["zeroconf>=0.149.16"]
# Security floor: utils/pdf opens PDFs the caller hands it, and every pypdf
# before 6.16.1 has a malformed-file infinite loop or memory blow-up
# (inline images, xref entries, /ToUnicode, CID widths, outlines, XForms).
pdf = ["pypdf>=6.16.1"]
office = ["openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=0.6"]
fuzzy = ["rapidfuzz>=3.0"]
s3 = ["boto3>=1.34"]
locale = ["babel>=2.12"]
audio = ["pycaw>=20240210"]
