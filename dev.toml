# The dev channel, je_auto_control_dev. The publish-dev job of .github/workflows/dev.yml builds it by
# writing this file to pyproject.toml (scripts/dev_release.py). The version below is a floor: CI publishes
# one patch above the newest release on PyPI and commits nothing back.
#
# Everything that decides what the package installs and ships is kept identical to pyproject.toml:
# [build-system], requires-python, dependencies, extras, scripts, entry points and [tool.setuptools].
# The reason for each pin and marker is in the comments there, not repeated here.
# test/unit_test/headless/test_dev_toml_parity.py fails when the two files differ.
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "je_auto_control_dev"
version = "0.0.135"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
description = "GUI Automation Framework"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = [
    "je_open_cv==0.0.22; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "opencv-python>=4.8,<6; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pillow==12.3.0",
    "pyobjc-core==12.2.2;platform_system=='Darwin'",
    "pyobjc==12.2.2;platform_system=='Darwin'",
    "python-Xlib==0.33;platform_system=='Linux' or platform_system=='FreeBSD' or platform_system=='OpenBSD' or platform_system=='NetBSD'",
    "mss==10.2.0",
    "defusedxml==0.7.1",
    "cryptography>=48.0.1; sys_platform != 'win32' or platform_machine != 'ARM64'"
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent"
]

[project.scripts]
je_auto_control = "je_auto_control.cli:main"
je_auto_control_mcp = "je_auto_control.utils.mcp_server.__main__:main"

[project.entry-points.pytest11]
# A top-level module that imports only pytest: as a submodule of the package
# it made every pytest start-up on the machine import the whole facade.
je_auto_control = "je_auto_control_pytest"

[project.urls]
Homepage = "https://github.com/Integration-Automation/AutoControlGUI"
Documentation = "https://autocontrol.readthedocs.io/en/latest/"
Code = "https://github.com/Integration-Automation/AutoControlGUI"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
py-modules = ["je_auto_control_pytest"]

[tool.setuptools.packages]
find = { namespaces = false }

[tool.setuptools.package-data]
"je_auto_control" = ["py.typed"]
"je_auto_control.utils.remote_desktop" = [
    "web_viewer/*.html",
    "web_viewer/*.js",
    "web_viewer/*.svg",
    "web_viewer/*.webmanifest",
    "web_viewer/mic-worklet.js",
]

[project.optional-dependencies]
gui = ["PySide6==6.11.2", "qt-material==2.17"]
webrtc = ["aiortc>=1.14.0", "av>=14.0.0"]
signaling = ["fastapi>=0.115", "starlette>=1.0.1", "uvicorn>=0.32"]
discovery = ["zeroconf>=0.149.16"]
pdf = ["pypdf>=6.16.1"]
office = ["openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=0.6"]
fuzzy = ["rapidfuzz>=3.0"]
s3 = ["boto3>=1.34"]
locale = ["babel>=2.12"]
audio = ["pycaw>=20240210"]
